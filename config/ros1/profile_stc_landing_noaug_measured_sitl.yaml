# PX4/Gazebo measured-state RH, stationary and moving targets.
# Start the planner with STC_PRESET=sitl (OCP numbers: preset "sitl" in
# include/ocp/ocp_stc_landing_noaug.hpp).
ocp_type: stc_landing_noaug
mode: mpc
n_replay: 3
measured_state_delay_compensation: true
initial_solve_lead_sec: 0.5
solve_lead_guard_sec: 0.15
land_action: force_disarm
predict_tracking_error: true
